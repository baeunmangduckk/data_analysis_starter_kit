# 출처 레지스트리 — 페이지 JSON의 모든 sourceId가 가리키는 유일한 목록이다.
#
# - id: 화면 라벨이 아니라 코드 키(slug)다. 한 번 정하면 바꾸지 않는다.
# - 다른 curated YAML의 `source:` 필드는 이 id 중 하나여야 하며, 목록에 없는 id를
#   쓰면 `npm run etl`이 전체 중단된다 (출처 없는 수치를 화면에 내보내지 않기 위함).
# - legacy_id: 레거시 대시보드(real_kpop_future) sources.json의 숫자 id. 값을 옮길 때
#   대조하기 위한 참고용이며 JSON 계약에는 노출하지 않는다.

