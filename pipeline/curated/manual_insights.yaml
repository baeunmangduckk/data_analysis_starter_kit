# 4개 KPI의 증감만으로는 자동 생성되지 않는 서사적 인사이트.
# docs/K-POP_대시보드_핵심_인사이트_보고서.docx에서 옮긴 문장이며,
# pipeline/etl.py의 load_manual_insights()가 InsightsData.insights에 병합한다.
# source는 화면에 노출되지 않고 분석가 참고용으로만 YAML에 남긴다.

insights:
  - id: manual_hybe_margin_squeeze
    severity: warning
    text: "하이브는 2025년 역대 최고 매출(2조 6,499억원, YoY +17.5%)을 기록했지만 영업이익은 499억원으로 YoY -72.9% 급감해, 매출 최고치 속 수익성 악화 신호가 나타나고 있습니다."
    source: "보고서 2절 (시장 전망)"

  - id: manual_capex_infra_gap
    severity: warning
    text: "대기업의 연평균 음악 제작비(431.1억원)는 중소기업(14.9억원)의 약 29배이며, 해외 투어 횟수도 대기업이 연 83.4회로 중소기업(4.0회)의 20배 이상입니다."
    source: "보고서 5-2절 (문체부·뉴스엔, 2023년 기준)"

  - id: manual_artist_survival_rate
    severity: info
    text: "1996~2025년 데뷔한 그룹 1,182팀 중 데뷔 5년 생존율은 36.6%, 10년 생존율은 17.9%에 불과하며, 손익분기점(30만 장)을 넘는 그룹은 전체의 3.55%뿐입니다."
    source: "보고서 5-3절 (김정섭 교수 연구)"

  - id: manual_physical_market_decline
    severity: warning
    text: "2025년 실물 음반 판매량은 9,890만 장으로 전년 대비 17.7% 감소해, 9년 만에 처음으로 '1억 장 시대'가 종료되었습니다."
    source: "보고서 5-4절 (지속가능성 리스크 요인)"

  - id: manual_export_axis_shift
    severity: info
    text: "방송콘텐츠 수출 프록시 기준 중화권 비중이 2014년 대비 76.1% 급감한 반면, 동남아·중동·중남미 등 신흥시장의 한류심리지수가 최상위권으로 부상해 수출 축이 지정학적으로 재편되고 있습니다."
    source: "보고서 3절 (글로벌 확장)"
