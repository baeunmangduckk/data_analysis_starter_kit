#   top20_share_pct    상위 20개 앨범 비중(%)
#   bottom50_share_pct 하위 50개(51~100위) 앨범 비중(%)
#   gini               판매량 지니계수 (0=균등, 1=완전 쏠림)
#   number1_sales      1위 앨범 판매량(장), rank100_sales: 100위 앨범 판매량(장)
#   total_top100_sales Top100 총 판매량(장)
#
# 주의: pipeline/collectors/circlechart.py가 API로 받은 2025년 원자료(raw/circlechart/
# album_2025.json)를 직접 집계하면 총 판매량 약 3,530만 장·Top10 38.9%·Gini 0.518로
# 이 표와 크게 다르다 (API 요청의 yearTime 파라미터 등 집계 기준 차이로 추정, 미확인).
# 그래서 이 페이지는 기획 문서 인용값과 일치하는 이 표를 쓴다.

